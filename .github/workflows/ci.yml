name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: traceforge
          POSTGRES_PASSWORD: traceforge
          POSTGRES_DB: traceforge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U traceforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://traceforge:traceforge@localhost:5433/traceforge
      # Production-mode build (next build runs with NODE_ENV=production) must
      # pass the env secrets guard in src/shared/config/env.ts — CI-only values.
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef0123456789ab
      INVITE_SIGNING_SECRET: ci-invite-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Full §5.2 cross-tenant + Better Auth suites need the schema.
      - run: pnpm exec drizzle-kit push
      # The realtime bus suite (tests/m8-bus-redis.test.ts) needs a REAL Redis and its binary (it kills and restarts one).
      # Like Postgres, a missing Redis FAILS the suite in CI instead of skipping it. It deliberately uses REDIS_TEST_URL,
      # not REDIS_URL, so the app under test stays in polling mode for smoke and the other steps.
      - name: Install and start Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo service redis-server start || true
          redis-cli ping
      - run: pnpm test
      - run: pnpm build
      # Degradation + worker pipeline against the PRODUCTION build and the CI Postgres.
      - run: pip install httpx
      - run: pnpm smoke
      # The pipeline runs with the Redis wake-up bus ENABLED (and asserts wake-ups beat the 5 s safety poll).
      - run: pnpm e2e:worker
        env:
          E2E_REDIS_URL: redis://127.0.0.1:6379

