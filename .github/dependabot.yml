# Dependency updates: minor and patch only, grouped into one PR per ecosystem.
#
# Why: a major bump of Next.js/React/Playwright cannot land unattended, and a
# stream of one-dependency PRs makes the required checks noisy. Majors are
# ignored here and stay an explicit owner decision; security advisories are
# unaffected by this file (they follow the repository's security settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
