# Dependency updates: version updates are OFF; security advisories still open
# PRs (they follow the repository's security settings, not this file).
#
# Why: the minor/patch group still produced a 46-failure browser run (Next 16.4,
# React 19.3, Playwright 1.65 and axe 4.14 in one batch - new axe rules and
# console-problem assertions). A red scheduled PR every Monday is worse than no
# scheduled PR: majors and toolchain minors are owner decisions here, not
# unattended merges. Re-enable by setting `open-pull-requests-limit` back to a
# positive number and running the batch by hand first.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 0
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
