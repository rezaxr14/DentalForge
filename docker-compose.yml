services:
  db:
    image: postgres:17-alpine
    container_name: traceforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: traceforge
      POSTGRES_PASSWORD: traceforge
      POSTGRES_DB: traceforge
    ports:
      - "5433:5432"
    volumes:
      - traceforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceforge -d traceforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional realtime wake-up bus (ADR-0015). Needed to run tests/m8-bus-redis.test.ts and `E2E_REDIS_URL=redis://localhost:6379 pnpm e2e:worker`.
  redis:
    image: redis:7-alpine
    container_name: traceforge-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  traceforge-pgdata:
